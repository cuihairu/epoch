<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Epoch · Layered Architecture</title>
<desc id="desc">Epoch is a deterministic Actor / Channel runtime built on Aeron. Top to bottom: application scenarios, language bindings, Epoch runtime core, transport layer, native bridge and the Aeron media driver. Solid edges are message data flow (input → Channel → Epoch ordering → Actor sequential execution → output@boundary → Transport → Aeron); dashed edges are control/contract relations (protocol &amp; semantic consistency, ECS and ActorId collaboration, stateHash verification, transport decoupling). Diagram is grounded in the repo code and design docs.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:14px;fill:#52647b}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1280" height="1420" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Epoch · Layered Architecture</text>
<text x="40" y="80" class="body" text-anchor="start">A deterministic Actor / Channel runtime on Aeron · time as first-class citizen · games and finance · solid = data flow, dashed = contracts</text>

<!-- Application scenarios -->
<g id="app-scope"><rect x="40" y="110" width="1200" height="150" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="60" y="145" class="body" text-anchor="start">Application scenarios (consumers · deterministic logic)</text>
<g id="game"><rect x="70" y="165" width="540" height="75" rx="12" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
<text x="90" y="196" class="name" text-anchor="start">Games</text>
<text x="90" y="223" class="body" text-anchor="start">Frame-sync / strong real-time / single-writer authority</text></g>
<g id="finance"><rect x="670" y="165" width="540" height="75" rx="12" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
<text x="690" y="196" class="name" text-anchor="start">Finance</text>
<text x="690" y="223" class="body" text-anchor="start">Sequential state-machine matching / risk control</text></g>
</g>

<!-- Language bindings -->
<g id="lang-scope"><rect x="40" y="290" width="1200" height="180" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="60" y="325" class="body" text-anchor="start">Language bindings (same protocol &amp; semantics · each implements its own Transport)</text>
<g id="lang-cpp"><rect x="70" y="355" width="180" height="95" rx="12" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="160" y="388" class="name" text-anchor="middle">C++17</text>
<text x="160" y="415" class="small" text-anchor="middle">Transport + protocol semantics</text>
<text x="160" y="437" class="small" text-anchor="middle">matching stateHash</text></g>
<g id="lang-java"><rect x="262" y="355" width="180" height="95" rx="12" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="352" y="388" class="name" text-anchor="middle">Java 17</text>
<text x="352" y="415" class="small" text-anchor="middle">Transport + protocol semantics</text>
<text x="352" y="437" class="small" text-anchor="middle">matching stateHash</text></g>
<g id="lang-dotnet"><rect x="454" y="355" width="180" height="95" rx="12" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="544" y="388" class="name" text-anchor="middle">.NET 8</text>
<text x="544" y="415" class="small" text-anchor="middle">Transport + protocol semantics</text>
<text x="544" y="437" class="small" text-anchor="middle">matching stateHash</text></g>
<g id="lang-go"><rect x="646" y="355" width="180" height="95" rx="12" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="736" y="388" class="name" text-anchor="middle">Go 1.24</text>
<text x="736" y="415" class="small" text-anchor="middle">Transport + protocol semantics</text>
<text x="736" y="437" class="small" text-anchor="middle">matching stateHash</text></g>
<g id="lang-node"><rect x="838" y="355" width="180" height="95" rx="12" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="928" y="388" class="name" text-anchor="middle">Node.js 22</text>
<text x="928" y="415" class="small" text-anchor="middle">Transport + protocol semantics</text>
<text x="928" y="437" class="small" text-anchor="middle">BigInt for 64-bit</text></g>
<g id="lang-python"><rect x="1030" y="355" width="180" height="95" rx="12" fill="#fff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="1120" y="388" class="name" text-anchor="middle">Python 3.12</text>
<text x="1120" y="415" class="small" text-anchor="middle">Transport + protocol semantics</text>
<text x="1120" y="437" class="small" text-anchor="middle">matching stateHash</text></g>
</g>

<!-- Protocol/semantic consistency dashed -->
<path d="M110 450 V500" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="semantic-left" data-from="lang-scope" data-to="core-scope" d="M110 450 V500" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow-gray)"/>
<path d="M1170 450 V500" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="semantic-right" data-from="lang-scope" data-to="core-scope" d="M1170 450 V500" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow-gray)"/>

<!-- Input data flow -->
<path d="M640 450 V560 H235 V575" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="input-flow" data-from="lang-scope" data-to="channel" d="M640 450 V560 H235 V575" class="edge" style="stroke:#2563eb;stroke-width:3" marker-end="url(#arrow-blue)"/>

<!-- Runtime core -->
<g id="core-scope"><rect x="40" y="500" width="1200" height="440" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="60" y="535" class="body" text-anchor="start">Epoch runtime core (determinism · replay · low jitter · high reasonability)</text>
<g id="channel"><rect x="90" y="575" width="290" height="110" rx="12" fill="#fff" stroke="#86c9b3" stroke-width="1.5"/>
<text x="110" y="609" class="name" text-anchor="start">Channel</text>
<text x="110" y="636" class="body" text-anchor="start">Enqueue only · no immediate execution</text>
<text x="110" y="663" class="body" text-anchor="start">MPSC / SPSC / Broadcast / Latest</text>
<text x="110" y="685" class="small" text-anchor="start">qos priority · higher first</text></g>
<g id="epoch"><rect x="430" y="575" width="260" height="110" rx="12" fill="#fff" stroke="#86c9b3" stroke-width="1.5"/>
<text x="450" y="609" class="name" text-anchor="start">Epoch</text>
<text x="450" y="636" class="body" text-anchor="start">Logical time slice · messages by Epoch</text>
<text x="450" y="663" class="body" text-anchor="start">Visibility at Epoch boundary</text>
<text x="450" y="685" class="small" text-anchor="start">replayable · rollback</text></g>
<g id="actor"><rect x="740" y="575" width="300" height="110" rx="12" fill="#fff" stroke="#86c9b3" stroke-width="1.5"/>
<text x="760" y="609" class="name" text-anchor="start">Actor</text>
<text x="760" y="636" class="body" text-anchor="start">Fixed thread · ordered per Epoch</text>
<text x="760" y="663" class="body" text-anchor="start">State visible only at boundary · no sync wait</text>
<text x="760" y="685" class="small" text-anchor="start">sourceId == actorId</text></g>
<g id="ecs"><rect x="90" y="730" width="300" height="100" rx="12" fill="#fff" stroke="#86c9b3" stroke-width="1.5"/>
<text x="110" y="764" class="name" text-anchor="start">ECS</text>
<text x="110" y="791" class="body" text-anchor="start">Cache-friendly data layout</text>
<text x="110" y="813" class="small" text-anchor="start">batched updates on Actor hot path</text></g>
<g id="actor-id"><rect x="430" y="730" width="320" height="100" rx="12" fill="#fff" stroke="#86c9b3" stroke-width="1.5"/>
<text x="450" y="764" class="name" text-anchor="start">ActorIdCodec</text>
<text x="450" y="791" class="body" text-anchor="start">64-bit · region|server|processType</text>
<text x="450" y="813" class="small" text-anchor="start">processIndex|actorIndex · pluggable</text></g>
<g id="engine"><rect x="790" y="730" width="350" height="100" rx="12" fill="#fff" stroke="#86c9b3" stroke-width="1.5"/>
<text x="810" y="764" class="name" text-anchor="start">Engine · stateHash</text>
<text x="810" y="791" class="body" text-anchor="start">process_messages → EpochResult(state, hash)</text>
<text x="810" y="813" class="small" text-anchor="start">FNV-1a · replay consistency check</text></g>
</g>

<!-- Core internal dashed collaboration -->
<path d="M240 730 V685" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="ecs-collab" data-from="ecs" data-to="channel" d="M240 730 V685" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow-gray)"/>
<path d="M590 730 V685" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="actorid-collab" data-from="actor-id" data-to="epoch" d="M590 730 V685" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow-gray)"/>
<path d="M965 730 V685" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="engine-collab" data-from="engine" data-to="actor" d="M965 730 V685" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow-gray)"/>

<!-- Core pipeline arrows -->
<path d="M380 630 H430" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="flow-ch-epoch" data-from="channel" data-to="epoch" d="M380 630 H430" class="edge" style="stroke:#2563eb;stroke-width:3" marker-end="url(#arrow-blue)"/>
<path d="M690 630 H740" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="flow-epoch-actor" data-from="epoch" data-to="actor" d="M690 630 H740" class="edge" style="stroke:#2563eb;stroke-width:3" marker-end="url(#arrow-blue)"/>

<!-- Output data flow: core → transport -->
<path d="M1040 630 H1160 V1080 H1140" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="output-flow" data-from="actor" data-to="aeron-transport" d="M1040 630 H1160 V1080 H1140" class="edge" style="stroke:#2563eb;stroke-width:3" marker-end="url(#arrow-blue)"/>

<!-- Transport layer -->
<g id="transport-scope"><rect x="40" y="970" width="1200" height="180" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="60" y="1005" class="body" text-anchor="start">Transport layer (Transport interface · decoupled from runtime · protocol is the cross-language source of truth)</text>
<g id="transport-iface"><rect x="90" y="1035" width="330" height="90" rx="12" fill="#fff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="110" y="1069" class="name" text-anchor="start">Transport interface</text>
<text x="110" y="1096" class="body" text-anchor="start">send(message) · poll(max) · close()</text></g>
<g id="in-memory"><rect x="460" y="1035" width="300" height="90" rx="12" fill="#fff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="480" y="1069" class="name" text-anchor="start">InMemoryTransport</text>
<text x="480" y="1096" class="body" text-anchor="start">In-memory queue · single process / tests</text></g>
<g id="aeron-transport"><rect x="800" y="1035" width="340" height="90" rx="12" fill="#fff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="820" y="1069" class="name" text-anchor="start">AeronTransport</text>
<text x="820" y="1096" class="body" text-anchor="start">publication / subscription · offer retry</text>
<text x="820" y="1118" class="small" text-anchor="start">AeronConfig · AeronStats</text></g>
</g>

<!-- Transport decouple dashed -->
<path d="M1105 940 V1035" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="transport-decouple" data-from="core-scope" data-to="aeron-transport" d="M1105 940 V1035" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow-gray)"/>

<!-- Transport → native bridge -->
<path d="M970 1125 V1215 H350 V1245" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="aeron-frames" data-from="aeron-transport" data-to="native" d="M970 1125 V1215 H350 V1245" class="edge" style="stroke:#2563eb;stroke-width:3" marker-end="url(#arrow-blue)"/>

<!-- Native bridge & external deps -->
<g id="native-scope"><rect x="40" y="1180" width="1200" height="170" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="60" y="1215" class="body" text-anchor="start">Native bridge &amp; external dependency</text>
<g id="native"><rect x="90" y="1245" width="520" height="80" rx="12" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="110" y="1279" class="name" text-anchor="start">epoch_aeron (C ABI · native/)</text>
<text x="110" y="1306" class="body" text-anchor="start">open / send / poll / stats / close · 56-byte frame · EPOCH_AERON_LIBRARY</text></g>
<g id="media-driver"><rect x="700" y="1245" width="480" height="80" rx="12" fill="#fff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="720" y="1279" class="name" text-anchor="start">Aeron Media Driver (external dep)</text>
<text x="720" y="1306" class="body" text-anchor="start">UDP / shared memory · loaded via EPOCH_AERON_LIBRARY</text></g>
</g>

<!-- Native → media driver -->
<path d="M610 1285 H700" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="native-media" data-from="native" data-to="media-driver" d="M610 1285 H700" class="edge" style="stroke:#2563eb;stroke-width:3" marker-end="url(#arrow-blue)"/>

<!-- Edge labels -->
<text x="655" y="553" class="label" text-anchor="start" style="fill:#2563eb">input messages (protocol semantics)</text>
<text transform="translate(1174 760) rotate(-90)" class="label" text-anchor="start" style="fill:#2563eb">output @ Epoch boundary</text>
<text x="125" y="483" class="label" text-anchor="start">protocol / semantics</text>
<text x="1160" y="483" class="label" text-anchor="end">test vectors · stateHash rules</text>
<text x="252" y="708" class="label" text-anchor="middle">collab</text>
<text x="596" y="708" class="label" text-anchor="middle">ActorId rules</text>
<text x="972" y="708" class="label" text-anchor="middle">stateHash check</text>
<text x="1120" y="995" class="label" text-anchor="start">decoupled</text>
<text x="955" y="1200" class="label" text-anchor="start" style="fill:#2563eb">Aeron frames</text>
<text x="655" y="1277" class="label" text-anchor="start" style="fill:#2563eb">media driver</text>

<!-- Legend -->
<text x="40" y="1385" class="small" text-anchor="start">Solid: message data flow (input → Channel → Epoch ordering → Actor sequential execution (+ECS batching) → output@boundary → Transport → Aeron)</text>
<text x="40" y="1410" class="small" text-anchor="start">Dashed: control / contract relations (protocol &amp; semantic consistency · ECS and ActorId collaboration · stateHash verification · transport decoupling) · grounded in repo code and docs/guide</text>
</svg>
