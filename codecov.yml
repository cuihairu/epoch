coverage:
  status:
    project:
      default:
        target: 0
    patch:
      default:
        target: 0

ignore:
  - "cpp/tests/**"
  - "java/src/test/**"
  - "dotnet/Epoch.Tests/**"
  - "go/*_test.go"
  - "node/test/**"
  - "python/tests/**"
  # Stale carryforward entries from historical uploads with unstripped or
  # project-relative path spellings; none of these are real repo paths.
  - "github.com/**"
  - "home/**"
  - "Users/**"
  - "io/**"
  - "epoch/**"
  - "src/**"
  - "test/**"
  - "tests/**"
  - "cppbuild/**"
  - "third_party/**"
  - "node_modules/**"

fixes:
  - "github.com/cuihairu/epoch/::"
  - "/home/runner/work/epoch/epoch/::"
  - "/Users/cui/Workspaces/epoch/::"

flags:
  cpp:
    paths:
      - cpp/
  java:
    paths:
      - java/
  dotnet:
    paths:
      - dotnet/
  go:
    paths:
      - go/
  node:
    paths:
      - node/
  python:
    paths:
      - python/
